<script>
const classroomDiv = document.getElementById("classroom");
let seatElements = [];
let seatCounter = 1;

const layouts = [
  [2,3,3,2],
  [2,3,3,2],
  [2,3,3,2],
  [2,3,3,2],
  [2,2,2,2]
];

layouts.forEach(rowLayout => {
  const row = document.createElement("div");
  row.className = "row";

  rowLayout.forEach(size => {
    const block = document.createElement("div");
    block.className = "block block-" + size;

    for (let i = 0; i < size; i++) {
      const seat = document.createElement("div");
      seat.className = "seat";
      seat.dataset.number = seatCounter; 
      seat.innerHTML = "<small>" + seatCounter + "</small>";
      seatCounter++;

      block.appendChild(seat);
      seatElements.push(seat);
    }

    row.appendChild(block);
  });

  classroomDiv.appendChild(row);
});

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function assignSeats() {
  const input = document.getElementById("names").value.trim();
  if (!input) {
    alert("Enter student names first.");
    return;
  }

  let names = input.split("\n").map(n => n.trim()).filter(n => n);
  if (names.length > seatElements.length) {
    alert("Too many students!");
    return;
  }

  const fixed20Name = "黄伟杰";
  const fixed42Name = "颜兀钤";

  
  if (!names.includes(fixed20Name)) names.push(fixed20Name);
  if (!names.includes(fixed42Name)) names.push(fixed42Name);

 
  let others = names.filter(n => n !== fixed20Name && n !== fixed42Name);

  seatElements.forEach(seat => {
    seat.innerHTML = "<small>" + seat.dataset.number + "</small>";
    seat.classList.remove("filled");
  });


  const realSeat19 = seatElements.find(seat => seat.dataset.number == 19);
  const realSeat20 = seatElements.find(seat => seat.dataset.number == 20);

  realSeat19.innerHTML = "<small>20</small><br>" + fixed20Name;
  realSeat20.innerHTML = "<small>42</small><br>" + fixed42Name;
  realSeat19.classList.add("filled");
  realSeat20.classList.add("filled");

  const blockedSeats = new Set([realSeat19, realSeat20]);
  const availableSeats = seatElements.filter(seat => !blockedSeats.has(seat));


  let shuffledSeats = shuffle([...availableSeats]).slice(0, others.length);
  let shuffledNames = shuffle([...others]);

  shuffledNames.forEach((name, i) => {
    const s = shuffledSeats[i];
    s.innerHTML = "<small>" + s.dataset.number + "</small><br>" + name;
    s.classList.add("filled");
  });
}
</script>
