
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>s3sf</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f4f6f8;
  display: flex;
  flex-direction: column;
  align-items: center;
}

textarea {
  width: 320px;
  height: 120px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
  resize: none;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #2ecc71;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #27ae60;
}

.classroom {
  margin-top: 30px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.row {
  display: flex;
  gap: 24px; /* more space between blocks */
  justify-content: center;
}

.block {
  display: grid;
  gap: 6px;
}

.block-2 { grid-template-columns: repeat(2, 50px); }
.block-3 { grid-template-columns: repeat(3, 50px); }

.seat {
  width: 50px;
  height: 50px;
  background: #dfe6e9;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  text-align: center;
  padding: 3px;
}

.seat small {
  font-size: 8px;
  opacity: 0.6;
}

.filled {
  background: #e74c3c;
  color: white;
}
</style>
</head>

<body>

<h1>macee attackkk!</h1>

<p>Names (one per line):</p>
<textarea id="names"></textarea>
<br>
<button onclick="assignSeats()">fate</button>

<div class="classroom" id="classroom"></div>

<script>
const classroomDiv = document.getElementById("classroom");
let seatElements = [];
let seatCounter = 1;

/*
Exact Layout:

Row 1–4:
ss  sss  sss  ss

Row 5:
ss  ss  ss  ss
*/

const layouts = [
  [2,3,3,2],
  [2,3,3,2],
  [2,3,3,2],
  [2,3,3,2],
  [2,2,2,2]
];

layouts.forEach(rowLayout => {
  const row = document.createElement("div");
  row.className = "row";

  rowLayout.forEach(size => {
    const block = document.createElement("div");
    block.className = "block block-" + size;

    for (let i = 0; i < size; i++) {
      const seat = document.createElement("div");
      seat.className = "seat";
      seat.dataset.number = seatCounter;
      seat.innerHTML = "<small>" + seatCounter + "</small>";
      seatCounter++;

      block.appendChild(seat);
      seatElements.push(seat);
    }

    row.appendChild(block);
  });

  classroomDiv.appendChild(row);
});

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function assignSeats() {
  const input = document.getElementById("names").value.trim();

  if (!input) {
    alert("Enter student names first.");
    return;
  }

  let names = input
    .split("\n")
    .map(n => n.trim())
    .filter(n => n);

  if (names.length > seatElements.length) {
    alert("Too many students!");
    return;
  }

  // 清空座位
  seatElements.forEach(seat => {
    seat.innerHTML =
      "<small>" + seat.dataset.number + "</small>";
    seat.classList.remove("filled");
  });

  // 移除20和49
  let remainingNames = names.filter(
    n => n !== "20" && n !== "49"
  );

  // ===== 建立每排座位 =====
  const rows = [];
  let seatIndex = 0;

  layouts.forEach(rowLayout => {
    const rowSeats = [];

    rowLayout.forEach(size => {
      for (let i = 0; i < size; i++) {
        rowSeats.push(seatElements[seatIndex]);
        seatIndex++;
      }
    });

    rows.push(rowSeats);
  });

  // ===== 找所有相邻座位 =====
  const adjacentPairs = [];

  rows.forEach(row => {
    for (let i = 0; i < row.length - 1; i++) {
      adjacentPairs.push([
        row[i],
        row[i + 1]
      ]);
    }
  });

  // 随机选择一对相邻座位
  const chosenPair =
    adjacentPairs[
      Math.floor(Math.random() * adjacentPairs.length)
    ];

  // 随机决定左右顺序
  const order =
    Math.random() < 0.5
      ? ["20", "49"]
      : ["49", "20"];

  chosenPair[0].innerHTML =
    `<small>${chosenPair[0].dataset.number}</small><br>${order[0]}`;

  chosenPair[1].innerHTML =
    `<small>${chosenPair[1].dataset.number}</small><br>${order[1]}`;

  chosenPair[0].classList.add("filled");
  chosenPair[1].classList.add("filled");

  // 剩余座位
  let availableSeats = seatElements.filter(
    seat =>
      seat !== chosenPair[0] &&
      seat !== chosenPair[1]
  );

  shuffle(availableSeats);
  shuffle(remainingNames);

  // 分配其他人
  remainingNames.forEach((name, i) => {

    if (!availableSeats[i]) return;

    availableSeats[i].innerHTML =
      `<small>${availableSeats[i].dataset.number}</small><br>${name}`;

    availableSeats[i].classList.add("filled");
  });
}
