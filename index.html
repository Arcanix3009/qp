<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>s3sf</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f4f6f8;
  display: flex;
  flex-direction: column;
  align-items: center;
}

textarea {
  width: 320px;
  height: 120px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
  resize: none;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #2ecc71;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #27ae60;
}

.classroom {
  margin-top: 30px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.row {
  display: flex;
  gap: 24px;
  justify-content: center;
}

.block {
  display: grid;
  gap: 6px;
}

.block-2 { grid-template-columns: repeat(2, 50px); }
.block-3 { grid-template-columns: repeat(3, 50px); }

.seat {
  width: 50px;
  height: 50px;
  background: #dfe6e9;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  text-align: center;
  padding: 3px;
}

.seat small {
  font-size: 8px;
  opacity: 0.6;
}

.filled {
  background: #e74c3c;
  color: white;
}

.paired {
  background: #3498db !important; /* 42和20用蓝色高亮，表示配对 */
  color: white;
  border: 2px solid #2980b9;
}
</style>
</head>

<body>
<h1>macee attackkk!</h1>

<p>Names (one per line):</p>
<textarea id="names" placeholder="Enter names (42 & 20 will always sit together)"></textarea>

<button onclick="assignSeats()">fate</button>

<div class="classroom" id="classroom"></div>

<script>
const classroomDiv = document.getElementById("classroom");
let seatElements = [];
let seatCounter = 1;

const layouts = [
  [2,3,3,2],
  [2,3,3,2],
  [2,3,3,2],
  [2,3,3,2],
  [2,2,2,2]
];

layouts.forEach(rowLayout => {
  const row = document.createElement("div");
  row.className = "row";

  rowLayout.forEach(size => {
    const block = document.createElement("div");
    block.className = "block block-" + size;

    for (let i = 0; i < size; i++) {
      const seat = document.createElement("div");
      seat.className = "seat";
      seat.dataset.number = seatCounter;
      seat.innerHTML = "<small>" + seatCounter + "</small>";
      seatCounter++;

      block.appendChild(seat);
      seatElements.push(seat);
    }

    row.appendChild(block);
  });

  classroomDiv.appendChild(row);
});

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function assignSeats() {
  const input = document.getElementById("names").value.trim();
  if (!input) {
    alert("Enter student names first.");
    return;
  }

  let names = input.split("\n").map(n => n.trim()).filter(n => n);
  if (names.length > seatElements.length) {
    alert("Too many students!");
    return;
  }

  // 重置所有座位
  seatElements.forEach(seat => {
    seat.innerHTML = "<small>" + seat.dataset.number + "</small>";
    seat.classList.remove("filled", "paired");
  });

  // 找到固定座位：42号和20号
  const seat42 = seatElements.find(seat => seat.dataset.number == 42);
  const seat20 = seatElements.find(seat => seat.dataset.number == 20);

  // 随机选择2个学生给固定座位对
  let shuffledNames = shuffle([...names]);
  const pairNames = shuffledNames.splice(0, 2); // 取前2个做配对

  // 固定分配到42和20（顺序随机）
  if (Math.random() > 0.5) {
    seat42.innerHTML = `<small>42</small><br>${pairNames[0]}`;
    seat20.innerHTML = `<small>20</small><br>${pairNames[1]}`;
  } else {
    seat42.innerHTML = `<small>42</small><br>${pairNames[1]}`;
    seat20.innerHTML = `<small>20</small><br>${pairNames[0]}`;
  }
  
  seat42.classList.add("filled", "paired");
  seat20.classList.add("filled", "paired");

  // 剩余学生随机分配到剩余座位
  const availableSeats = seatElements.filter(seat => seat.dataset.number != 42 && seat.dataset.number != 20);
  let shuffledSeats = shuffle([...availableSeats]).slice(0, shuffledNames.length);

  shuffledNames.forEach((name, i) => {
    shuffledSeats[i].innerHTML = `<small>${shuffledSeats[i].dataset.number}</small><br>${name}`;
    shuffledSeats[i].classList.add("filled");
  });
}
</script>
</body>
</html>
